
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteo de tareas</title>
</head>
<body>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  #galaxy-bg { position: fixed; inset: 0; z-index: 0; }
  #galaxy-bg canvas { width: 100% !important; height: 100% !important; }
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; padding: 2.5rem 1rem; font-family: var(--font-sans); background: transparent; }
  .tirada-num { font-size: 12px; color: #7a7a7a; margin-bottom: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .titulo { font-size: 26px; font-weight: 500; color: #fff; margin-bottom: 2.2rem; text-align: center; min-height: 40px; }
  .slot-wrapper { position: relative; width: 280px; height: 90px; margin-bottom: 2.5rem; }
  .slot-reel { overflow: hidden; height: 90px; border-radius: 10px; background: rgba(10,10,10,0.6); backdrop-filter: blur(4px); border: 1px solid #2a2a2a; }
  .slot-shine-top { position: absolute; top: 0; left: 0; right: 0; height: 30px; background: linear-gradient(to bottom, #000 0%, transparent 100%); z-index: 2; pointer-events: none; border-radius: 10px 10px 0 0; }
  .slot-shine-bot { position: absolute; bottom: 0; left: 0; right: 0; height: 30px; background: linear-gradient(to top, #000 0%, transparent 100%); z-index: 2; pointer-events: none; border-radius: 0 0 10px 10px; }
  .reel-track { display: flex; flex-direction: column; align-items: center; will-change: transform; }
  .reel-item { height: 90px; width: 280px; max-width: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 500; color: #fff; flex-shrink: 0; }
  .reel-item.signo { color: #333; font-size: 32px; letter-spacing: 6px; }
  .btn-girar { background: rgba(15,15,15,0.6); backdrop-filter: blur(8px); border: 1px solid #2a2a2a; border-radius: 50px; padding: 15px 52px; font-size: 17px; font-weight: 500; color: #fff; cursor: pointer; transition: border-color 0.2s, transform 0.1s; }
  .btn-girar:hover:not(:disabled) { border-color: #555; transform: translateY(-1px); }
  .btn-girar:active:not(:disabled) { transform: scale(0.96); }
  .btn-girar:disabled { opacity: 0.25; cursor: default; transform: none; }
  .resultado-panel { margin-top: 2.2rem; width: 100%; max-width: 520px; background: rgba(13,13,13,0.7); backdrop-filter: blur(8px); border-radius: 12px; border: 1px solid #1e1e1e; padding: 1rem 1.4rem; }
  .resultado-fila { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; }
  .resultado-item { display: flex; gap: 5px; align-items: center; }
  .resultado-label { color: #444; }
  .resultado-valor { font-weight: 500; color: #fff; }
  .resultado-valor.nuevo { animation: pulseVal 0.6s ease; }
  @keyframes pulseVal { 0%{opacity:0} 60%{opacity:1} 100%{opacity:1} }
  .resultado-final { width: 100%; max-width: 520px; text-align: center; animation: fadeUp 0.5s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .resultado-final-titulo { font-size: 20px; letter-spacing: 0.15em; text-transform: uppercase; color: #969696; margin-bottom: 1.6rem; }
  .resultado-final-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 2rem; }
  .resultado-final-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: #0d0d0d; border-radius: 10px; border: 1px solid #1e1e1e; animation: fadeUp 0.4s ease both; }
  .resultado-final-item:nth-child(1){animation-delay:0.05s}
  .resultado-final-item:nth-child(2){animation-delay:0.12s}
  .resultado-final-item:nth-child(3){animation-delay:0.19s}
  .resultado-final-item:nth-child(4){animation-delay:0.26s}
  .resultado-final-rol { font-size: 13px; color: #f0dc84; letter-spacing: 0.08em; }
  .resultado-final-nombre { font-size: 22px; font-weight: 500; color: #fff; }
  .btn-reiniciar { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 50px; padding: 13px 38px; font-size: 15px; font-weight: 500; color: #fff; cursor: pointer; transition: border-color 0.2s, transform 0.1s; }
  .btn-reiniciar:hover { border-color: #555; transform: translateY(-1px); }
  .btn-reiniciar:active { transform: scale(0.97); }

  @media (max-width: 480px) {
    .app { padding: 2rem 1.2rem; justify-content: center; }
    .titulo { font-size: 22px; margin-bottom: 1.6rem; }
    .tirada-num { font-size: 11px; }
    .slot-wrapper { width: 100%; max-width: 320px; height: 84px; margin-bottom: 2rem; }
    .slot-reel { height: 84px; }
    .reel-item { height: 84px; width: 100%; font-size: 36px; }
    .reel-item.signo { font-size: 28px; letter-spacing: 5px; }
    .btn-girar { padding: 14px 44px; font-size: 16px; }
    .resultado-panel { margin-top: 1.6rem; padding: 0.9rem 1rem; }
    .resultado-fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .resultado-item { flex-direction: column; align-items: flex-start; gap: 2px; }
    .resultado-label { font-size: 11px; color: #555; }
    .resultado-valor { font-size: 15px; }
    .resultado-final-nombre { font-size: 19px; }
    .resultado-final-titulo { font-size: 16px; }
  }
</style>

<div id="galaxy-bg"></div>
<div class="app" id="app">
  <div class="tirada-num" id="tiradaNum">Tirada 1 de 4</div>
  <div class="titulo" id="titulo">¿Quién llama?</div>
  <div class="slot-wrapper">
    <div class="slot-reel">
      <div class="reel-track" id="reelTrack">
        <div class="reel-item signo">????????</div>
      </div>
    </div>
    <div class="slot-shine-top"></div>
    <div class="slot-shine-bot"></div>
  </div>
  <button class="btn-girar" id="btnGirar" onclick="girar()">Girar</button>
  <div class="resultado-panel">
    <div class="resultado-fila">
      <span class="resultado-item"><span class="resultado-label">Llama:</span> <span class="resultado-valor" id="r0">—</span></span>
      <span class="resultado-item"><span class="resultado-label">Busca:</span> <span class="resultado-valor" id="r1">—</span></span>
      <span class="resultado-item"><span class="resultado-label">Pone mesa:</span> <span class="resultado-valor" id="r2">—</span></span>
      <span class="resultado-item"><span class="resultado-label">Lava:</span> <span class="resultado-valor" id="r3">—</span></span>
    </div>
  </div>
</div>

<script>
const TIRADAS = [
  { titulo: '¿Quién llama?',        nombres: ['Brandi','Brian','Mauro','Lu','Dolores'] },
  { titulo: '¿Quién busca?',        nombres: ['Brandi','Brian','Mauro','Lu'] },
  { titulo: '¿Quién pone la mesa?', nombres: ['Brandi','Brian','Mauro','Lu','Dolores'] },
  { titulo: '¿Quién lava?',         nombres: ['Brandi','Brian','Mauro','Lu','Dolores','Ale'] },
];

let tiradaActual = 0;
let resultados = [];
let girando = false;

function getNombresDisponibles(idx) {
  const usados = new Set(resultados);
  return TIRADAS[idx].nombres.filter(n => !usados.has(n));
}

function actualizarPanel(idx, nombre) {
  const el = document.getElementById('r' + idx);
  el.textContent = nombre;
  el.classList.remove('nuevo');
  void el.offsetWidth;
  el.classList.add('nuevo');
}

function girar() {
  if (girando) return;
  const lista = getNombresDisponibles(tiradaActual);
  if (!lista.length) return;

  girando = true;
  document.getElementById('btnGirar').disabled = true;

  const elegido = lista[Math.floor(Math.random() * lista.length)];
  const ITEM_H = 90;
  const EXTRAS = 22 + Math.floor(Math.random() * 6);
  const track = document.getElementById('reelTrack');

  // Build strip: all ????????, elegido only at the very last position
  const strip = [];
  for (let i = 0; i < EXTRAS; i++) strip.push(null);
  strip.push(elegido);

  // Ocultar mientras construimos el strip para que el nombre no se vea
  track.style.opacity = '0';
  track.style.transition = 'none';
  track.style.transform = 'translateY(0px)';
  track.innerHTML = '';

  strip.forEach((n) => {
    const div = document.createElement('div');
    if (n === null) {
      div.className = 'reel-item signo';
      div.textContent = '????????';
    } else {
      div.className = 'reel-item';
      div.textContent = n;
    }
    track.appendChild(div);
  });

  const duracion = 2000;

  requestAnimationFrame(() => {
    // Leer altura real del item en runtime (puede variar en mobile)
    const firstItem = track.querySelector('.reel-item');
    const realH = firstItem ? firstItem.getBoundingClientRect().height : ITEM_H;
    const targetY = -((strip.length - 1) * realH);

    track.style.transform = 'translateY(0px)';
    track.style.opacity = '1'; // mostrar recién acá, ya posicionado en el primer ítem

    requestAnimationFrame(() => {
      track.style.transition = `transform ${duracion}ms cubic-bezier(0.12, 0.9, 0.3, 1.0)`;
      track.style.transform = `translateY(${targetY}px)`;
    });
  });

  setTimeout(() => {
    resultados[tiradaActual] = elegido;
    actualizarPanel(tiradaActual, elegido);
    girando = false;
    tiradaActual++;

    if (tiradaActual < TIRADAS.length) {
      setTimeout(() => {
        document.getElementById('titulo').textContent = TIRADAS[tiradaActual].titulo;
        document.getElementById('tiradaNum').textContent = `Tirada ${tiradaActual + 1} de 4`;
        track.style.transition = 'none';
        track.innerHTML = '<div class="reel-item signo">????????</div>';
        track.style.transform = 'translateY(0px)';
        document.getElementById('btnGirar').disabled = false;
      }, 1000);
    } else {
      setTimeout(() => mostrarFinal(), 1000);
    }
  }, duracion + 100);
}

function mostrarFinal() {
  const roles = ['Llama','Busca','Pone mesa','Lava'];
  document.getElementById('app').innerHTML = `
    <div class="resultado-final">
      <div class="resultado-final-titulo">Ronda completa</div>
      <div class="resultado-final-lista">
        ${roles.map((r, i) => `
          <div class="resultado-final-item">
            <span class="resultado-final-rol">${r}</span>
            <span class="resultado-final-nombre">${resultados[i]}</span>
          </div>
        `).join('')}
      </div>
      <button class="btn-reiniciar" onclick="reiniciar()">Volver a empezar</button>
    </div>
  `;
}

function reiniciar() {
  tiradaActual = 0;
  resultados = [];
  girando = false;
  document.getElementById('app').innerHTML = `
    <div class="tirada-num" id="tiradaNum">Tirada 1 de 4</div>
    <div class="titulo" id="titulo">${TIRADAS[0].titulo}</div>
    <div class="slot-wrapper">
      <div class="slot-reel">
        <div class="reel-track" id="reelTrack">
          <div class="reel-item signo">????????</div>
        </div>
      </div>
      <div class="slot-shine-top"></div>
      <div class="slot-shine-bot"></div>
    </div>
    <button class="btn-girar" id="btnGirar" onclick="girar()">Girar</button>
    <div class="resultado-panel">
      <div class="resultado-fila">
        <span class="resultado-item"><span class="resultado-label">Llama:</span> <span class="resultado-valor" id="r0">—</span></span>
        <span class="resultado-item"><span class="resultado-label">Busca:</span> <span class="resultado-valor" id="r1">—</span></span>
        <span class="resultado-item"><span class="resultado-label">Pone mesa:</span> <span class="resultado-valor" id="r2">—</span></span>
        <span class="resultado-item"><span class="resultado-label">Lava:</span> <span class="resultado-valor" id="r3">—</span></span>
      </div>
    </div>
  `;
}
</script>
</body></html>

<script type="module">
import { Renderer, Program, Mesh, Color, Triangle } from 'https://cdn.jsdelivr.net/npm/ogl@1.0.11/src/index.js';

const vertexShader = `
attribute vec2 uv;
attribute vec2 position;
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0, 1);
}`;

const fragmentShader = `
precision highp float;
uniform float uTime;
uniform vec3 uResolution;
uniform vec2 uFocal;
uniform float uStarSpeed;
uniform float uDensity;
uniform float uHueShift;
uniform float uSpeed;
uniform vec2 uMouse;
uniform float uGlowIntensity;
uniform float uSaturation;
uniform float uTwinkleIntensity;
uniform float uRotationSpeed;
uniform float uMouseActiveFactor;
varying vec2 vUv;

#define NUM_LAYER 4.0
#define STAR_COLOR_CUTOFF 0.2
#define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)

float Hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float tri(float x) { return abs(fract(x) * 2.0 - 1.0); }
float tris(float x) { float t = fract(x); return 1.0 - smoothstep(0.0, 1.0, abs(2.0*t-1.0)); }
float trisn(float x) { float t = fract(x); return 2.0*(1.0-smoothstep(0.0,1.0,abs(2.0*t-1.0)))-1.0; }
vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}
float Star(vec2 uv, float flare) {
  float d = length(uv);
  float m = (0.05 * uGlowIntensity) / d;
  float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * flare * uGlowIntensity;
  uv *= MAT45;
  rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * 0.3 * flare * uGlowIntensity;
  m *= smoothstep(1.0, 0.2, d);
  return m;
}
vec3 StarLayer(vec2 uv) {
  vec3 col = vec3(0.0);
  vec2 gv = fract(uv) - 0.5;
  vec2 id = floor(uv);
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 offset = vec2(float(x), float(y));
      vec2 si = id + vec2(float(x), float(y));
      float seed = Hash21(si);
      float size = fract(seed * 345.32);
      float glossLocal = tri(uStarSpeed / (3.0 * seed + 1.0));
      float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;
      float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
      float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
      float grn = min(red, blu) * seed;
      vec3 base = vec3(red, grn, blu);
      float hue = atan(base.g - base.r, base.b - base.r) / (2.0 * 3.14159) + 0.5;
      hue = fract(hue + uHueShift / 360.0);
      float sat = length(base - vec3(dot(base, vec3(0.299, 0.587, 0.114)))) * uSaturation;
      float val = max(max(base.r, base.g), base.b);
      base = hsv2rgb(vec3(hue, sat, val));
      vec2 pad = vec2(tris(seed*34.0 + uTime*uSpeed/10.0), tris(seed*38.0 + uTime*uSpeed/30.0)) - 0.5;
      float star = Star(gv - offset - pad, flareSize);
      float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
      twinkle = mix(1.0, twinkle, uTwinkleIntensity);
      star *= twinkle;
      col += star * size * base;
    }
  }
  return col;
}
void main() {
  vec2 focalPx = uFocal * uResolution.xy;
  vec2 uv = (vUv * uResolution.xy - focalPx) / uResolution.y;
  float autoRotAngle = uTime * uRotationSpeed;
  mat2 autoRot = mat2(cos(autoRotAngle), -sin(autoRotAngle), sin(autoRotAngle), cos(autoRotAngle));
  uv = autoRot * uv;
  vec3 col = vec3(0.0);
  for (float i = 0.0; i < 1.0; i += 1.0 / NUM_LAYER) {
    float depth = fract(i + uStarSpeed * uSpeed);
    float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
    float fade = depth * smoothstep(1.0, 0.9, depth);
    col += StarLayer(uv * scale + i * 453.32) * fade;
  }
  float alpha = length(col);
  alpha = smoothstep(0.0, 0.3, alpha);
  alpha = min(alpha, 1.0);
  gl_FragColor = vec4(col, alpha);
}`;

const ctn = document.getElementById('galaxy-bg');
const renderer = new Renderer({ alpha: true, premultipliedAlpha: false });
const gl = renderer.gl;
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0, 0, 0, 0);

function resize() {
  renderer.setSize(ctn.offsetWidth, ctn.offsetHeight);
  if (program) {
    program.uniforms.uResolution.value = new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height);
  }
}
window.addEventListener('resize', resize);

const geometry = new Triangle(gl);
let program = new Program(gl, {
  vertex: vertexShader,
  fragment: fragmentShader,
  uniforms: {
    uTime: { value: 0 },
    uResolution: { value: new Color(1, 1, 1) },
    uFocal: { value: new Float32Array([0.5, 0.5]) },
    uStarSpeed: { value: 0.5 },
    uDensity: { value: 1.0 },
    uHueShift: { value: 140 },
    uSpeed: { value: 0.8 },
    uMouse: { value: new Float32Array([0.5, 0.5]) },
    uGlowIntensity: { value: 0.3 },
    uSaturation: { value: 0.8 },
    uTwinkleIntensity: { value: 0.4 },
    uRotationSpeed: { value: 0.05 },
    uMouseActiveFactor: { value: 0.0 },
  }
});

resize();
const mesh = new Mesh(gl, { geometry, program });
ctn.appendChild(gl.canvas);

function update(t) {
  requestAnimationFrame(update);
  program.uniforms.uTime.value = t * 0.001;
  program.uniforms.uStarSpeed.value = (t * 0.001 * 0.5) / 10.0;
  renderer.render({ scene: mesh });
}
requestAnimationFrame(update);
</script>
